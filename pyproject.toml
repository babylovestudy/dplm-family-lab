[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dplm-family-lab"
version = "0.1.0"
description = "Reproducible family-directed adaptation of DPLM-1 for protein sequence generation"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10,<3.13"
dependencies = ["numpy>=1.26,<2", "PyYAML>=6,<7", "requests>=2.31,<3", "biopython>=1.83,<1.86"]

[project.optional-dependencies]
train = ["torch==2.2.0", "transformers==4.39.2", "omegaconf==2.3.0", "einops==0.8.0", "tqdm>=4.66,<5", "huggingface-hub>=0.23,<1"]
dev = ["pytest>=8,<9", "ruff>=0.9,<1"]
hmm = ["pyhmmer>=0.11,<0.13"]
analysis = ["matplotlib>=3.9,<3.11"]

[project.scripts]
dplm-lab = "dplm_family_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"dplm_family_lab._vendor" = ["LICENSE", "SOURCE.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["src/dplm_family_lab/_vendor"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"tests/test_*backend.py" = ["E402"]
